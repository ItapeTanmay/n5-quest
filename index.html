        <div class="mt-4 space-y-2 max-h-56 overflow-y-auto pr-1">
          ${k.words.map((w, wi) => `
            <div class="p-3 rounded-2xl bg-slate-900/90 border border-white/10 flex items-start justify-between gap-2">
              <div>
                <div class="flex flex-wrap items-baseline gap-2">
                  <span class="font-jp text-base font-black text-white">${w.w}</span>
                  <span class="font-jp text-xs font-bold text-cyan-300">${w.r}</span>
                  <span class="text-xs text-emerald-300 font-semibold">— ${w.m}</span>
                </div>
                <div class="font-jp text-xs text-slate-300 mt-1">${w.ex}</div>
              </div>
              <button data-km-speak="${wi}" class="shrink-0 px-2 py-1 rounded-lg bg-cyan-500/20 text-cyan-200 text-xs font-bold">🔊</button>
            </div>
          `).join('')}
        </div>

        <div class="mt-4 grid grid-cols-2 gap-3">
          <button id="km-speak-main" class="py-2.5 rounded-2xl font-bold text-sm bg-cyan-500/20 border border-cyan-400/40 text-cyan-200">🔊 Replay</button>
          <button id="km-toggle-learned" class="py-2.5 rounded-2xl font-black text-sm ${isM ? 'bg-emerald-500/25 border border-emerald-400/50 text-emerald-200' : 'bg-emerald-500 text-slate-950'}">${isM ? '✓ Learned (Undo)' : '✓ Mark Learned (+25 XP)'}</button>
        </div>
      `);

      document.getElementById('km-speak-main').addEventListener('click', () => speakJP(getKanjiPrimaryReading(k), true));
      document.querySelectorAll('[data-km-speak]').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = k.words[Number(btn.dataset.kmSpeak)];
          if (item) speakJP(item.ex || item.r, true);
        });
      });
      document.getElementById('km-toggle-learned').addEventListener('click', (e) => {
        if ((state.kanjiMastered || []).includes(k.id)) {
          state.kanjiMastered = state.kanjiMastered.filter(x => x !== k.id);
          saveState(); updateHUD();
        } else {
          markKanjiMastered(k.id);
          addXP(25, e.clientX, e.clientY);
          playSfx('skip');
        }
        openKanjiFlashcardModal(k.id, onChange);
        if (onChange) onChange();
      });
    }

    function renderKanjiCodex() {
      clearAllTimers();
      view = 'kanji_codex';
      setSectionTab('kanji');
      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="max-w-6xl mx-auto">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div class="flex items-center gap-3">
              <button id="kcx-back" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300">← Kanji Dashboard</button>
              <h2 class="text-xl font-black text-white">Basic Kanji 120 Codex</h2>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <input id="kcx-search" type="text" placeholder="Search kanji, kana, meaning..." class="px-3.5 py-2 rounded-xl bg-slate-900/90 border border-white/15 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 w-56" />
              <select id="kcx-day" class="px-3 py-2 rounded-xl bg-slate-900/90 border border-white/15 text-sm text-white">
                <option value="all">All 4 Days (120)</option>
                ${KANJI_DAYS.map(d => `<option value="${d.day}">Day ${d.day}: #${d.range[0]}–${d.range[1]}</option>`).join('')}
              </select>
              <select id="kcx-status" class="px-3 py-2 rounded-xl bg-slate-900/90 border border-emerald-400/40 text-sm text-emerald-200 font-bold">
                <option value="all">Status: All Kanji</option>
                <option value="learned">✓ Learned Only (${(state.kanjiMastered || []).length})</option>
                <option value="unlearned">📖 Not Learned Yet</option>
                <option value="weak">👾 Weak Kanji (${Object.keys(state.kanjiWeak || {}).length})</option>
              </select>
            </div>
          </div>

          <div class="glass rounded-2xl p-3.5 mb-4 border border-amber-400/30 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
              <span class="text-xl">📋</span>
              <div>
                <div class="text-sm font-black text-white">Test Your Learned Kanji (All 4 Days)</div>
                <div id="kcx-mcq-sub" class="text-xs text-slate-400">${(state.kanjiMastered || []).length} learned Kanji ready for a shuffled Meaning & Reading MCQ</div>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <select id="kcx-mcq-count" class="px-3 py-2 rounded-xl bg-slate-900/90 border border-white/15 text-xs font-bold text-white">
                <option value="all">All Kanji</option>
                <option value="20">Random 20</option>
                <option value="50">Random 50</option>
              </select>
              <button id="kcx-mcq-learned" class="px-4 py-2 rounded-xl text-xs font-black bg-gradient-to-r from-amber-500 to-rose-600 hover:brightness-110 text-white shadow-lg transition">📋 MCQ: All Learned (${(state.kanjiMastered || []).length})</button>
              <button id="kcx-mcq-filtered" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-purple-500/20 hover:bg-purple-500/30 border border-purple-400/40 text-purple-200 transition">🎯 MCQ: Filtered (120)</button>
            </div>
          </div>

          <div id="kcx-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
        </div>
      `;

      document.getElementById('kcx-back').addEventListener('click', renderKanjiDashboard);
      const searchEl = document.getElementById('kcx-search');
      const dayEl = document.getElementById('kcx-day');
      const statusEl = document.getElementById('kcx-status');
      const countEl = document.getElementById('kcx-mcq-count');
      const btnLearned = document.getElementById('kcx-mcq-learned');
      const btnFiltered = document.getElementById('kcx-mcq-filtered');
      const subEl = document.getElementById('kcx-mcq-sub');
      let latestFiltered = KANJI_LIST;

      function drawKanjiCodex() {
        const q = searchEl.value.trim().toLowerCase();
        const dVal = dayEl.value;
        const sVal = statusEl.value;
        const mSet = new Set(state.kanjiMastered || []);
        const wMap = state.kanjiWeak || {};

        statusEl.options[1].textContent = `✓ Learned Only (${mSet.size})`;
        statusEl.options[3].textContent = `👾 Weak Kanji (${Object.keys(wMap).length})`;
        btnLearned.textContent = `📋 MCQ: All Learned (${mSet.size})`;
        subEl.textContent = `${mSet.size} learned Kanji ready for a shuffled Meaning & Reading MCQ`;

        const filtered = KANJI_LIST.filter(k => {
          if (dVal !== 'all' && k.day !== Number(dVal)) return false;
          if (sVal === 'learned' && !mSet.has(k.id)) return false;
          if (sVal === 'unlearned' && mSet.has(k.id)) return false;
          if (sVal === 'weak' && !wMap[k.id]) return false;
          if (!q) return true;
          return k.kanji.includes(q) || k.kun.includes(q) || k.on.includes(q) || k.meaning.toLowerCase().includes(q);
        });
        latestFiltered = filtered;
        btnFiltered.textContent = `🎯 MCQ: Filtered (${filtered.length})`;

        const grid = document.getElementById('kcx-grid');
        if (filtered.length === 0) {
          grid.innerHTML = `<div class="col-span-full glass rounded-2xl p-8 text-center text-sm text-slate-400">No Kanji match this filter yet.</div>`;
          return;
        }
        grid.innerHTML = filtered.map(k => {
          const isM = mSet.has(k.id);
          return `
            <button data-kcx-id="${k.id}" class="glass rounded-2xl p-3.5 text-left border ${isM ? 'border-emerald-400/45 bg-emerald-500/10' : 'border-white/10 hover:border-amber-400/50'} transition">
              <div class="flex items-center justify-between text-[10px] font-bold text-slate-400 mb-1">
                <span>#${k.id} · D${k.day}</span>
                <span class="${isM ? 'text-emerald-300' : 'text-slate-500'}">${isM ? '✓ Learned' : ''}</span>
              </div>
              <div class="font-jp text-4xl font-black text-white text-center my-1.5">${k.kanji}</div>
              <div class="font-jp text-xs font-bold text-cyan-300 text-center truncate">${getKanjiFullReadingLabel(k)}</div>
              <div class="text-xs font-extrabold text-slate-200 text-center truncate mt-0.5">${k.meaning}</div>
            </button>
          `;
        }).join('');

        grid.querySelectorAll('[data-kcx-id]').forEach(btn => {
          btn.addEventListener('click', () => openKanjiFlashcardModal(Number(btn.dataset.kcxId), drawKanjiCodex));
        });
      }

      btnLearned.addEventListener('click', () => {
        const mSet = new Set(state.kanjiMastered || []);
        const learned = KANJI_LIST.filter(k => mSet.has(k.id));
        if (learned.length < 2) { showToast('Learn at least 2 Kanji first!', 'rose'); return; }
        const lim = countEl.value === 'all' ? 0 : Number(countEl.value);
        startKanjiMCQ(learned, { returnTo: 'kanji_codex', label: 'ALL LEARNED KANJI MCQ', limit: lim });
      });

      btnFiltered.addEventListener('click', () => {
        if (latestFiltered.length < 2) { showToast('Need at least 2 Kanji in filter!', 'rose'); return; }
        const lim = countEl.value === 'all' ? 0 : Number(countEl.value);
        startKanjiMCQ(latestFiltered, { returnTo: 'kanji_codex', label: 'FILTERED KANJI MCQ', limit: lim });
      });

      searchEl.addEventListener('input', drawKanjiCodex);
      dayEl.addEventListener('change', drawKanjiCodex);
      statusEl.addEventListener('change', drawKanjiCodex);
      drawKanjiCodex();
    }

    document.getElementById('nav-tab-vocab').addEventListener('click', () => { setSectionTab('vocab'); renderDashboard(); });
    document.getElementById('nav-tab-kanji').addEventListener('click', renderKanjiDashboard);
    document.getElementById('btn-home-logo').addEventListener('click', () => { setSectionTab('vocab'); renderDashboard(); });
    document.getElementById('btn-cloud-sync').addEventListener('click', showCloudSyncModal);
    document.getElementById('btn-badges').addEventListener('click', showBadgesModal);
    document.getElementById('btn-weak-queue').addEventListener('click', showWeakModal);
    document.getElementById('btn-toggle-audio').addEventListener('click', () => {
      state.audioEnabled = !state.audioEnabled;
      saveState();
      updateHUD();
      showToast(state.audioEnabled ? '🔊 Audio & Speech ON' : '🔇 Audio Muted', 'cyan');
    });

    // Boot App
    updateHUD();
    updateCloudDot();
    renderDashboard();
    if (loadCloudCfg().token && loadCloudCfg().gistId) {
      pullFromGitHubGist(true);
    }
  })();
  </script>
</body>
</html>
