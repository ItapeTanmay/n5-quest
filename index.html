  <style>
    :root {
      --bg-deep: #070913;
      --bg-panel: #101426;

      --neon-purple: #a855f7;
      --neon-orange: #f97316;
      --neon-gold: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 15% 10%, #17153b 0%, #070913 55%, #05060d 100%);
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-jp { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
    .glass {
      background: rgba(16, 20, 38, 0.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .neon-glow-cyan { box-shadow: 0 0 22px rgba(34, 211, 238, 0.25); }
    .neon-glow-pink { box-shadow: 0 0 24px rgba(244, 63, 94, 0.3); }
    .neon-glow-orange { box-shadow: 0 0 24px rgba(249, 115, 22, 0.3); }
    .neon-glow-purple { box-shadow: 0 0 24px rgba(168, 85, 247, 0.3); }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.75; }
      70% { transform: scale(1.08); opacity: 0; }
      100% { transform: scale(1.08); opacity: 0; }
    }
    @keyframes shakeHit {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    @keyframes popIn {
      0% { transform: scale(0.88); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-float { animation: floatSlow 3.2s ease-in-out infinite; }
    .animate-shake { animation: shakeHit 0.35s ease; }
    .animate-pop { animation: popIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .conveyor-track {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(34, 211, 238, 0.14) 0px,
        rgba(34, 211, 238, 0.14) 24px,
        rgba(15, 23, 42, 0.7) 24px,
        rgba(15, 23, 42, 0.7) 48px
      );
      background-size: 48px 100%;
      animation: beltScroll 0.8s linear infinite;
    }
    @keyframes beltScroll {
      from { background-position-x: 0; }
      to { background-position-x: 48px; }
    }
    .manga-panel {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      border: 2px solid rgba(255, 255, 255, 0.16);
      box-shadow: 6px 6px 0px rgba(244, 63, 94, 0.45);
    }
    #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
    }
    .kbd-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;

      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #e2e8f0;

    async function pushToGitHubGist(silent = false) {
      const cfg = loadCloudCfg();
      if (!cfg.token) {
        if (!silent) showToast('Enter your GitHub Token first!', 'rose');
        return false;
      }
      updateCloudDot('syncing');
      const payload = {
        description: 'N5 NEON QUEST — Private Progress Save',
        public: false,
        files: {
          'n5-neon-quest-save.json': {
            content: JSON.stringify(state, null, 2)
          }
        }
      };
      try {
        const url = cfg.gistId
          ? `https://api.github.com/gists/${encodeURIComponent(cfg.gistId.trim())}`
          : 'https://api.github.com/gists';
        const method = cfg.gistId ? 'PATCH' : 'POST';
        const res = await fetch(url, {
          method,
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${cfg.token.trim()}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(`GitHub API ${res.status}`);
        const data = await res.json();
        if (!cfg.gistId && data.id) {
          cfg.gistId = data.id;
          saveCloudCfg(cfg);
        }
        updateCloudDot();
        if (!silent) showToast('☁️ Progress saved to your private GitHub Gist!', 'emerald');
        return true;
      } catch (e) {
        updateCloudDot('error');
        if (!silent) showToast('Cloud save failed — check your GitHub token & Gist ID.', 'rose');
        return false;
      }
    }

        const data = await res.json();
        const fileObj = data.files && data.files['n5-neon-quest-save.json'];
        if (!fileObj || !fileObj.content) throw new Error('Save file not found in Gist');

    let audioCtx = null;
    function getAudioCtx() {

    function playSfx(type) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.07);
        osc.frequency.setValueAtTime(783.99, now + 0.14);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc.start(now); osc.stop(now + 0.33);
      } else if (type === 'skip') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.16);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.start(now); osc.stop(now + 0.23);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.linearRampToValueAtTime(115, now + 0.24);
        gain.gain.setValueAtTime(0.13, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.start(now); osc.stop(now + 0.29);
      } else if (type === 'bossHit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.18);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.start(now); osc.stop(now + 0.23);
      } else if (type === 'victory') {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((f, idx) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'triangle';
          o.connect(g); g.connect(ctx.destination);
          o.frequency.setValueAtTime(f, now + idx * 0.1);
          g.gain.setValueAtTime(0.14, now + idx * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.35);
          o.start(now + idx * 0.1); o.stop(now + idx * 0.1 + 0.36);
        });
      }
    }

    function speakJP(text, force = false) {
      if (!state.audioEnabled && !force) return;
      try {
        const clean = String(text || '').replace(/～|~/g, '').replace(/（.*?）/g, '').replace(/\(.*?\)/g, '').split('/')[0].trim();
        if (!clean) return;
        lastSpokenText = clean;
        if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
        if (fallbackAudioEl) { try { fallbackAudioEl.pause(); } catch (e) {} fallbackAudioEl = null; }

        if (!('speechSynthesis' in window)) {
          playOnlineJpFallback(clean, force);
          return;
        }

        if (!cachedJpVoice) refreshJpVoice();

        // If browser (e.g. Brave without Windows Japanese voice pack) has no ja-JP voice, use online TTS fallback
        if (!cachedJpVoice) {
          playOnlineJpFallback(clean, force);
          return;
        }

        const runSpeak = () => {
          try {
            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            const utter = new SpeechSynthesisUtterance(clean);
            utter.lang = 'ja-JP';
            utter.rate = 0.9;
            utter.voice = cachedJpVoice;
            activeUtterance = utter;
            utter.onend = () => { activeUtterance = null; };
            utter.onerror = () => {
              activeUtterance = null;
              playOnlineJpFallback(clean, force);
            };
            window.speechSynthesis.speak(utter);
          } catch (e) {
            playOnlineJpFallback(clean, force);
          }
        };

        if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
          window.speechSynthesis.cancel();
          speakTimer = setTimeout(runSpeak, 60);
        } else {
          runSpeak();
        }
      } catch (e) {}
    }

    const fxCanvas = document.getElementById('fx-canvas');

    let particles = [];
    function resizeFx() {

    }
    window.addEventListener('resize', resizeFx);

    function spawnParticles(x, y, color = '#22d3ee', count = 24) {
      const cx = x ?? window.innerWidth / 2;
      const cy = y ?? window.innerHeight / 2;
      const palette = [color, '#facc15', '#f43f5e', '#a855f7', '#ffffff'];
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const speed = 2.5 + Math.random() * 6.5;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          r: 2.5 + Math.random() * 4,
          life: 1,
          decay: 0.02 + Math.random() * 0.02,
          color: palette[Math.floor(Math.random() * palette.length)]
        });
      }
    }

    function tickParticles() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.14;
        p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        fxCtx.globalAlpha = p.life;
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.globalAlpha = 1;
      requestAnimationFrame(tickParticles);
    }

    function formatMnemonicHTML(text) {
      return text.replace(/\*\*(.*?)\*\*/g, '<span class="px-1.5 py-0.5 rounded bg-amber-400/20 text-amber-200 font-extrabold border border-amber-400/30">$1</span>');
    }

    // =========================================================================
    // 4. PROGRESSION, XP, SRS WEAK MONSTERS & BADGES
    // =========================================================================
    function getLevel(xp) {
      return Math.floor(Math.sqrt(xp / 120)) + 1;
    }

    function addXP(amount, x, y) {
      state.xp += amount;
      spawnParticles(x, y, '#22d3ee', 18);
      checkBadges();
      saveState();
      updateHUD();
    }

    function markMastered(wordId, viaSkip = false) {
      if (!state.mastered.includes(wordId)) {
        state.mastered.push(wordId);
      }
      if (viaSkip && !state.knownSkipped.includes(wordId)) {
        state.knownSkipped.push(wordId);
      }
      if (state.weakWords[wordId]) {
        delete state.weakWords[wordId];
      }
      checkBadges();
      saveState();
      updateHUD();
    }

    function recordAnswer(wordId, isCorrect, x, y) {
      if (isCorrect) {
        state.streak += 1;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;
        const mult = Math.min(4, 1 + Math.floor(state.streak / 5));
        state.xp += 15 * mult;

        if (state.weakWords[wordId]) {
          state.weakWords[wordId].streak += 1;
          if (state.weakWords[wordId].streak >= 3) {
            delete state.weakWords[wordId];
            if (!state.mastered.includes(wordId)) state.mastered.push(wordId);
            showToast(`✨ Weak Monster purified! (${WORD_MAP.get(wordId).kana}) +50 XP`, 'emerald');
            state.xp += 50;
          }
        } else {
          if (!state.mastered.includes(wordId)) state.mastered.push(wordId);
        }
        playSfx('correct');
        spawnParticles(x, y, '#22d3ee', 20);
      } else {
        state.streak = 0;
        if (!state.weakWords[wordId]) {
          state.weakWords[wordId] = { streak: 0, misses: 1 };
        } else {
          state.weakWords[wordId].streak = 0;
          state.weakWords[wordId].misses += 1;
        }
        playSfx('wrong');
      }
      checkBadges();
      saveState();
      updateHUD();
    }

    function checkBadges() {
      BADGES.forEach(b => {
        if (!state.badges.includes(b.id) && b.check(state)) {
          state.badges.push(b.id);
          showToast(`🏆 Badge Unlocked: ${b.icon} ${b.name}!`, 'amber');
          playSfx('victory');
        }
      });
    }

    function getDayWords(dayNum) {
      return WORDS.filter(w => w.day === dayNum);
    }

    function getDayBatches(dayNum) {
      const dayMeta = DAYS[dayNum - 1];
      const batches = [];
      (dayMeta.lessons || []).forEach(lessonNum => {
        const lWords = WORDS.filter(w => w.lesson === lessonNum);
        for (let i = 0; i < lWords.length; i += 10) {
          const chunk = lWords.slice(i, i + 10);
          chunk.lesson = lessonNum;
          chunk.lessonTitle = chunk[0]?.lessonTitle || '';
          chunk.partNum = Math.floor(i / 10) + 1;
          chunk.totalParts = Math.ceil(lWords.length / 10);
          batches.push(chunk);
        }
      });
      return batches;
    }

    function getDayMasteredCount(dayNum) {
      const set = new Set(state.mastered);
      return getDayWords(dayNum).filter(w => set.has(w.id)).length;
    }

    function showToast(msg, tone = 'cyan') {
      const container = document.getElementById('toast-container');
      const tones = {
        cyan: 'bg-cyan-950/90 border-cyan-400/50 text-cyan-100',
        emerald: 'bg-emerald-950/90 border-emerald-400/50 text-emerald-100',
        rose: 'bg-rose-950/90 border-rose-400/50 text-rose-100',
        amber: 'bg-amber-950/90 border-amber-400/50 text-amber-100'
      };
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-xl border text-sm font-bold shadow-2xl animate-pop ${tones[tone] || tones.cyan}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 320); }, 2600);
    }

    function updateHUD() {
      const dayWords = getDayWords(state.currentDay);
      const dayMastered = getDayMasteredCount(state.currentDay);
      const totalMastered = state.mastered.length;
      const pct = Math.round((totalMastered / WORDS.length) * 100);

      document.getElementById('hud-day-pill').textContent = `DAY ${state.currentDay}`;
      document.getElementById('hud-mastered-count').textContent = `${totalMastered} / ${WORDS.length}`;
      document.getElementById('hud-day-target').textContent = `Day ${state.currentDay}: ${dayMastered} / ${dayWords.length}`;
      document.getElementById('hud-progress-bar').style.width = `${pct}%`;
      document.getElementById('hud-streak').textContent = state.streak;
      document.getElementById('hud-lvl').textContent = `Lv.${getLevel(state.xp)}`;
      document.getElementById('hud-xp').textContent = `${state.xp.toLocaleString()} XP`;
      document.getElementById('hud-weak-count').textContent = Object.keys(state.weakWords).length;

      const tvEl = document.getElementById('tab-vocab-count');
      const tkEl = document.getElementById('tab-kanji-count');
      if (tvEl) tvEl.textContent = `${totalMastered}/${WORDS.length}`;
      if (tkEl) tkEl.textContent = `${(state.kanjiMastered || []).length}/${KANJI_LIST.length}`;

      const audioBtn = document.getElementById('btn-toggle-audio');
      audioBtn.innerHTML = state.audioEnabled
        ? '<i data-lucide="volume-2" class="w-4 h-4"></i>'
        : '<i data-lucide="volume-x" class="w-4 h-4 text-slate-500"></i>';
      if (window.lucide) lucide.createIcons();
    }

    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pickDistractors(targetWord, pool, count = 3) {
      const candidates = shuffle(pool.filter(w => w.id !== targetWord.id && w.meaning !== targetWord.meaning));
      const picked = candidates.slice(0, count);
      if (picked.length < count) {
        const fallback = shuffle(WORDS.filter(w => w.id !== targetWord.id && !picked.some(p => p.id === w.id)));
        picked.push(...fallback.slice(0, count - picked.length));
      }
      return picked;
    }

      session = {
        queue,
        idx: 0,

    function setupSushiRound() {
      clearAllTimers();
      if (session.idx >= session.queue.length) {
        renderArcadeSummary('Visual Sushi Conveyor', '🍣', 'detective');
        return;
      }
      const target = session.queue[session.idx];
      session.options = shuffle([target, ...pickDistractors(target, activeBatchWords, 3)]);
      session.plateX = 2;
      session.locked = false;
      speakJP(target.kana);
      renderSushiUI();

      // Animate conveyor belt plate
      let lastTs = performance.now();
      function step(ts) {
        if (view !== 'sushi' || session.locked) return;
        const dt = Math.min(40, ts - lastTs);
        lastTs = ts;
        session.plateX += dt * (0.0115 + Math.min(0.008, session.combo * 0.0008));
        const plateEl = document.getElementById('sushi-plate');
        if (plateEl) {
          plateEl.style.left = `${Math.min(84, session.plateX)}%`;
        }
        if (session.plateX >= 84) {
          handleSushiChoice(-1); // Timeout miss!
          return;
        }
        regRaf(step);
      }
      regRaf(step);
    }

    function getDetectiveFullSentence(w) {
      const cleanKana = w.kana.replace(/［.*?］|\[.*?\]|（.*?）|\(.*?\)/g, '').split('／')[0].trim() || w.kana;
      const fullJp = w.contextJp.replace('[ ___ ]', cleanKana);
      const shortM = w.meaning.split(';')[0].split(',')[0].trim();
      const tpl = w.contextJp;
      let fullEn = `${shortM}`;
      if (tpl.startsWith('きょうは')) fullEn = `Today I ${shortM}.`;
      else if (tpl.startsWith('これはとても')) fullEn = `This is very ${shortM}.`;
      else if (tpl.includes('べんきょうします')) fullEn = `I study (${shortM}).`;
      else if (tpl.startsWith('ここに [ ___ ] あります')) fullEn = `There is/are ${shortM} here.`;
      else if (tpl.startsWith('「[ ___ ]」')) fullEn = `You say "${shortM}".`;
      else if (tpl.startsWith('レストランで')) fullEn = `I have ${shortM} at a restaurant.`;
      else if (tpl.startsWith('えきまで')) fullEn = `I go to the station by ${shortM}.`;
      else if (tpl.includes('ともだちにあいます')) fullEn = `I meet my friend (${shortM}).`;
      else if (tpl.startsWith('あのひとは')) fullEn = `That person is ${shortM}.`;
      else if (tpl.startsWith('がっこうで')) fullEn = `I use ${shortM} at school.`;
      else if (tpl.startsWith('へやに')) fullEn = `There is ${shortM} in the room.`;
      else if (tpl.startsWith('ここに [ ___ ] があります')) fullEn = `Here is ${shortM}.`;
      return { cleanKana, fullJp, fullEn };
    }

      const dayMeta = DAYS[dayNum - 1];
      const dayPool = getDayWords(dayNum);

      // Inject Weak Monsters first so user must defeat them 3 times in a row!
      const weakList = Object.keys(state.weakWords).map(Number).map(id => WORD_MAP.get(id)).filter(Boolean);
      let battleWords = [];
      if (isWarmup && customQueue) {
        battleWords = shuffle(customQueue).slice(0, 12);
      } else {
        const weakSlice = shuffle(weakList).slice(0, 6);
        const needed = Math.max(6, 12 - weakSlice.length);
        const daySlice = shuffle(dayPool.filter(w => !weakSlice.some(x => x.id === w.id))).slice(0, needed);
        battleWords = shuffle([...weakSlice, ...daySlice]);
      }

      session = {
        dayNum,
        isWarmup,
        bossName: isWarmup ? 'Weak Monster Swarm' : dayMeta.boss,
        bossEmoji: isWarmup ? '👾' : dayMeta.bossEmoji,
        bossMaxHP: battleWords.length,
        bossHP: battleWords.length,
        playerHP: 5,
        playerMaxHP: 5,
        queue: battleWords,
        idx: 0,
        locked: false,
        options: [],
        pool: dayPool
      };
      setupBossTurn();
    }

    function setupBossTurn() {
      if (session.bossHP <= 0) {
        renderBossResult(true);
        return;
      }
      if (session.playerHP <= 0) {
        renderBossResult(false);
        return;
      }
      if (session.idx >= session.queue.length) {
        // Loop remaining weak/day words if boss still has HP
        session.queue = shuffle(session.queue);
        session.idx = 0;
      }
      const target = session.queue[session.idx];
      session.options = shuffle([target, ...pickDistractors(target, session.pool, 3)]);
      session.locked = false;
      speakJP(target.kana);
      renderBossUI();
    }

    function renderBossUI() {
      const root = document.getElementById('app-root');
      const target = session.queue[session.idx];
      const bossPct = Math.max(0, Math.round((session.bossHP / session.bossMaxHP) * 100));
      const isWeak = Boolean(state.weakWords[target.id]);
      const weakStreak = isWeak ? state.weakWords[target.id].streak : 0;

      root.innerHTML = `
        <div class="max-w-3xl mx-auto">
          <div class="flex items-center justify-between mb-4">
            <button id="btn-back-dash" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300">← Retreat</button>
            <div class="flex items-center gap-1 text-lg" title="Your HP">
              ${Array.from({ length: session.playerMaxHP }, (_, i) => i < session.playerHP ? '❤️' : '🖤').join('')}
            </div>
            <button id="btn-boss-audio" class="px-2.5 py-1 rounded-xl text-xs font-bold bg-cyan-500/20 text-cyan-200 border border-cyan-400/40">🔊 <span class="kbd-chip ml-1">Space</span></button>
          </div>

          <!-- BOSS ARENA -->
          <div id="boss-arena" class="glass rounded-3xl p-6 border border-rose-500/40 neon-glow-pink mb-5 text-center relative overflow-hidden">
            <div class="flex items-center justify-between text-xs font-extrabold uppercase tracking-wider mb-1.5">
              <span class="text-rose-300">${session.bossEmoji} ${session.bossName}</span>
              <span class="text-rose-200">HP ${session.bossHP} / ${session.bossMaxHP}</span>
            </div>
            <div class="h-3.5 rounded-full bg-slate-900 overflow-hidden border border-rose-400/30 mb-5">
              <div class="h-full rounded-full bg-gradient-to-r from-rose-500 via-orange-500 to-amber-400 transition-all duration-300" style="width:${bossPct}%"></div>
            </div>

            <div class="text-6xl mb-3 animate-float">${session.bossEmoji}</div>

            ${isWeak ? `<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold bg-rose-500/25 text-rose-200 border border-rose-400/50 mb-3">👾 WEAK MONSTER · Defeat Streak: ${weakStreak}/3</div>` : ''}

            <div class="font-jp text-4xl sm:text-5xl font-black text-white mb-1">${target.kanji}</div>
            ${target.hasKanji ? `<div class="font-jp text-lg font-bold text-cyan-300 mb-1">${target.kana}</div>` : ''}
            <div class="text-xs font-mono uppercase tracking-widest text-slate-400">${target.romaji} · ${target.posRaw}</div>
          </div>

          <!-- STRIKE OPTIONS -->

            ${session.options.map((opt, i) => `
              <button data-boss-opt="${i}" class="glass rounded-2xl p-4 text-left border border-white/15 hover:border-rose-400/70 hover:bg-rose-500/10 transition flex items-center gap-3">
                <span class="kbd-chip">${i + 1}</span>

                <span class="font-bold text-sm sm:text-base text-white">${opt.meaning}</span>
              </button>
            `).join('')}
          </div>
        </div>

      document.getElementById('btn-back-dash').addEventListener('click', renderDashboard);
      document.getElementById('btn-boss-audio').addEventListener('click', () => speakJP(target.kana, true));
      root.querySelectorAll('[data-boss-opt]').forEach(btn => {
        btn.addEventListener('click', (e) => handleBossChoice(Number(btn.dataset.bossOpt), e.clientX, e.clientY));
      });
    }

    function handleBossChoice(choiceIdx, x, y) {
      if (session.locked) return;
      session.locked = true;
      const target = session.queue[session.idx];
      const chosen = session.options[choiceIdx];
      const isCorrect = chosen.id === target.id;
      const arena = document.getElementById('boss-arena');

      document.querySelectorAll('[data-boss-opt]').forEach((b, idx) => {
        const opt = session.options[idx];
        if (opt.id === target.id) b.classList.add('border-emerald-400', 'bg-emerald-500/20');
        else if (idx === choiceIdx && !isCorrect) b.classList.add('border-rose-500', 'bg-rose-500/20', 'animate-shake');
      });

      if (isCorrect) {
        session.bossHP -= 1;
        playSfx('bossHit');
        if (arena) arena.classList.add('animate-shake');
        recordAnswer(target.id, true, x, y);
      } else {
        session.playerHP -= 1;
        recordAnswer(target.id, false, x, y);
        showToast(`💥 Boss counter-attack! "${target.kana}" = ${target.meaning}`, 'rose');
      }

      regTimeout(() => {
        session.idx += 1;
        setupBossTurn();
      }, isCorrect ? 650 : 1250);
    }

    function renderBossResult(won) {
      clearAllTimers();
      if (won) {
        playSfx('victory');
        if (!session.isWarmup && !state.bossesDefeated.includes(session.dayNum)) {
          state.bossesDefeated.push(session.dayNum);
        }
        addXP(session.isWarmup ? 100 : 250);
      }
      const root = document.getElementById('app-root');
      root.innerHTML = `

          <h2 class="text-3xl font-black text-white mb-2">${won ? `${session.bossName} Defeated!` : 'Retreat & Regroup!'}</h2>
          <p class="text-sm text-slate-300 mb-6">
            ${won
              ? (session.isWarmup ? 'Great SRS warm-up! Keep defeating Weak Monsters 3 times in a row to purify them.' : `Day ${session.dayNum} conquered! +250 Bonus XP banked. Ready for the next world?`)
              : 'Every missed word was saved to your Weak Monster queue so you can crush it on the rematch!'}
          </p>
          <div class="flex flex-wrap justify-center gap-3">
            ${won && !session.isWarmup && session.dayNum < 7 ? `<button id="boss-next-day" class="px-5 py-3 rounded-2xl font-black text-sm bg-gradient-to-r from-cyan-500 to-purple-600 text-white">Advance to Day ${session.dayNum + 1} →</button>` : ''}
            <button id="boss-retry" class="px-5 py-3 rounded-2xl font-bold text-sm bg-rose-500/20 border border-rose-400/40 text-rose-200">Rematch</button>
            <button id="boss-home" class="px-5 py-3 rounded-2xl font-bold text-sm bg-white/5 border border-white/15 text-slate-200">Back to Roadmap</button>
          </div>
        </div>
      `;
      const nextBtn = document.getElementById('boss-next-day');
      if (nextBtn) nextBtn.addEventListener('click', () => { state.currentDay = session.dayNum + 1; saveState(); updateHUD(); renderDashboard(); });
      document.getElementById('boss-retry').addEventListener('click', () => startBossBattle(session.dayNum, session.isWarmup));
      document.getElementById('boss-home').addEventListener('click', renderDashboard);
    }


    // =========================================================================
    // 10B. CUSTOM LESSON & PART TEST (TRADITIONAL SHUFFLED MCQ & FLASHCARDS)
    // =========================================================================
    function openCustomTestModal(dayNum) {
      const dayMeta = DAYS[dayNum - 1];
      const batches = getDayBatches(dayNum);
      const masteredSet = new Set(state.mastered);

      // Default selection: all parts that have at least 1 mastered word, or Part 1 if none yet
      const defaultSelected = new Set();
      batches.forEach((b, idx) => {
        if (b.some(w => masteredSet.has(w.id))) defaultSelected.add(idx);
      });
      if (defaultSelected.size === 0 && batches.length > 0) defaultSelected.add(0);

      openModal(`
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-xl font-black text-white">📝 Custom Test — Day ${dayNum}</h3>
            <p class="text-xs text-slate-400">Pick which Lessons & Parts you've finished. Words shuffle in a fresh random order every time.</p>
          </div>
          <button data-close-modal class="px-2.5 py-1 rounded-lg bg-white/10 text-xs font-bold text-slate-200">Close</button>
        </div>

        <div class="flex flex-wrap items-center gap-2 mb-4">
          <button id="ct-sel-done" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/40 text-emerald-200 transition">✓ Auto-Select Started/Done</button>
          <button id="ct-sel-all" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-400/40 text-cyan-200 transition">Select All Day ${dayNum}</button>
          <button id="ct-sel-none" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/5 hover:bg-white/10 border border-white/15 text-slate-300 transition">Clear</button>
          <span id="ct-count-badge" class="ml-auto px-3 py-1 rounded-full text-xs font-black bg-purple-500/25 text-purple-200 border border-purple-400/40">0 words selected</span>
        </div>

        <div id="ct-lesson-list" class="space-y-3 max-h-72 overflow-y-auto pr-1 mb-5">
          ${(dayMeta.lessons || []).map(lessonNum => {
            const lessonBatches = batches.map((b, globalIdx) => ({ b, globalIdx })).filter(x => x.b.lesson === lessonNum);
            const lTitle = lessonBatches[0]?.b.lessonTitle || '';
            return `
              <div class="p-3 rounded-2xl bg-slate-900/80 border border-white/10">
                <div class="flex items-center justify-between mb-2">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" data-ct-lesson="${lessonNum}" class="w-4 h-4 accent-cyan-400 rounded" />
                    <span class="font-extrabold text-sm text-white">Lesson ${lessonNum}: <span class="text-slate-300 font-semibold">${lTitle}</span></span>
                  </label>
                </div>
                <div class="flex flex-wrap gap-2 pl-6">
                  ${lessonBatches.map(({ b, globalIdx }) => {
                    const done = b.filter(w => masteredSet.has(w.id)).length;
                    const checked = defaultSelected.has(globalIdx) ? 'checked' : '';
                    return `
                      <label class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 cursor-pointer text-xs font-bold text-slate-200">
                        <input type="checkbox" data-ct-batch="${globalIdx}" data-parent-lesson="${lessonNum}" ${checked} class="w-3.5 h-3.5 accent-cyan-400" />
                        <span>Part ${b.partNum}</span>
                        <span class="text-[10px] ${done === b.length ? 'text-emerald-300' : 'text-slate-400'}">(${done}/${b.length})</span>
                      </label>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button id="ct-start-mcq" class="py-3.5 px-4 rounded-2xl font-black text-sm bg-gradient-to-r from-cyan-500 to-blue-600 hover:brightness-110 text-white shadow-lg transition">
            📋 Start Shuffled MCQ Test
          </button>
          <button id="ct-start-cards" class="py-3.5 px-4 rounded-2xl font-black text-sm bg-gradient-to-r from-purple-500 to-pink-600 hover:brightness-110 text-white shadow-lg transition">
            🃏 Start Shuffled Flashcards
          </button>
        </div>
      `);

      const box = document.getElementById('modal-box');
      function syncCounts() {
        const checkedBatches = Array.from(box.querySelectorAll('[data-ct-batch]:checked')).map(el => Number(el.dataset.ctBatch));
        const wordCount = checkedBatches.reduce((sum, idx) => sum + (batches[idx]?.length || 0), 0);
        document.getElementById('ct-count-badge').textContent = `${wordCount} words selected`;
        // Sync parent lesson checkboxes
        (dayMeta.lessons || []).forEach(lNum => {
          const kids = Array.from(box.querySelectorAll(`[data-parent-lesson="${lNum}"]`));
          const parent = box.querySelector(`[data-ct-lesson="${lNum}"]`);
          if (parent && kids.length) parent.checked = kids.every(k => k.checked);
        });
      }

      box.querySelectorAll('[data-ct-batch]').forEach(cb => cb.addEventListener('change', syncCounts));
      box.querySelectorAll('[data-ct-lesson]').forEach(cb => {
        cb.addEventListener('change', () => {
          const lNum = cb.dataset.ctLesson;
          box.querySelectorAll(`[data-parent-lesson="${lNum}"]`).forEach(k => { k.checked = cb.checked; });
          syncCounts();
        });
      });

      document.getElementById('ct-sel-all').addEventListener('click', () => {
        box.querySelectorAll('[data-ct-batch]').forEach(k => { k.checked = true; });
        syncCounts();
      });
      document.getElementById('ct-sel-none').addEventListener('click', () => {
        box.querySelectorAll('[data-ct-batch]').forEach(k => { k.checked = false; });
        syncCounts();
      });
      document.getElementById('ct-sel-done').addEventListener('click', () => {
        box.querySelectorAll('[data-ct-batch]').forEach(k => {
          const b = batches[Number(k.dataset.ctBatch)];
          k.checked = b.some(w => masteredSet.has(w.id));
        });
        syncCounts();
      });

      function getSelectedWords() {
        const idxs = Array.from(box.querySelectorAll('[data-ct-batch]:checked')).map(el => Number(el.dataset.ctBatch));
        const list = [];
        idxs.forEach(i => list.push(...batches[i]));
        return list;
      }

      document.getElementById('ct-start-mcq').addEventListener('click', () => {
        const picked = getSelectedWords();
        if (picked.length < 2) { showToast('Pick at least 1 part to start the test!', 'rose'); return; }
        closeModal();
        startCustomMCQ(picked);
      });
      document.getElementById('ct-start-cards').addEventListener('click', () => {
        const picked = getSelectedWords();
        if (picked.length < 1) { showToast('Pick at least 1 part to start flashcards!', 'rose'); return; }
        closeModal();
        startCustomFlashcards(picked);
      });

      syncCounts();
    }

    // Traditional Shuffled MCQ Test
    function startCustomMCQ(wordPool, opts = {}) {
      clearAllTimers();
      view = 'custom_mcq';
      const shuffledAll = shuffle(wordPool);
      const limit = opts.limit && opts.limit > 0 ? Math.min(opts.limit, shuffledAll.length) : shuffledAll.length;
      session = {
        pool: wordPool.slice(),
        queue: shuffledAll.slice(0, limit),
        idx: 0,
        hits: 0,
        misses: 0,
        locked: false,
        options: [],
        returnTo: opts.returnTo || 'dashboard',
        label: opts.label || 'SHUFFLED MCQ',
        limit: opts.limit || 0
      };
      setupCustomMCQTurn();
    }

    function setupCustomMCQTurn() {
      if (session.idx >= session.queue.length) {
        const title = session.label === 'ALL LEARNED MCQ' ? 'All Learned MCQ Test' : 'Shuffled MCQ Test';
        renderCustomTestSummary(title, '📋', () => startCustomMCQ(session.pool, {
          returnTo: session.returnTo,
          label: session.label,
          limit: session.limit
        }));
        return;
      }
      const target = session.queue[session.idx];
      session.options = shuffle([target, ...pickDistractors(target, session.pool.length >= 4 ? session.pool : WORDS, 3)]);
      session.locked = false;
      speakJP(target.kana);
      renderCustomMCQUI();
    }

      const target = session.queue[session.idx];
      const pos = POS_STYLES[target.pos] || POS_STYLES.noun;

            <span class="px-3 py-1 rounded-full text-xs font-extrabold bg-cyan-500/20 text-cyan-200 border border-cyan-400/40">📋 ${session.label || 'SHUFFLED MCQ'} · ${session.idx + 1} / ${session.queue.length}</span>

            <div id="mcq-feedback" class="mt-4"></div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${session.options.map((opt, i) => `
              <button data-mcq-opt="${i}" class="glass rounded-2xl p-4 text-left border border-white/15 hover:border-cyan-400/70 hover:bg-cyan-500/10 transition flex items-center gap-3">
                <span class="kbd-chip">${i + 1}</span>
                <span class="font-bold text-sm sm:text-base text-white">${opt.meaning}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;

      document.getElementById('btn-back-dash').addEventListener('click', () => session.returnTo === 'codex' ? renderCodex() : renderDashboard());
      document.getElementById('btn-mcq-audio').addEventListener('click', () => speakJP(target.kana, true));

        btn.addEventListener('click', (e) => handleCustomMCQChoice(Number(btn.dataset.mcqOpt), e.clientX, e.clientY));
      });

    function handleCustomMCQChoice(choiceIdx, x, y) {
      if (session.locked) return;
      session.locked = true;
      const target = session.queue[session.idx];
      const chosen = session.options[choiceIdx];
      const isCorrect = chosen.id === target.id;
      const { fullJp, fullEn } = getDetectiveFullSentence(target);

      document.querySelectorAll('[data-mcq-opt]').forEach((b, idx) => {
        const opt = session.options[idx];
        if (opt.id === target.id) b.classList.add('border-emerald-400', 'bg-emerald-500/20');
        else if (idx === choiceIdx && !isCorrect) b.classList.add('border-rose-500', 'bg-rose-500/20', 'animate-shake');
      });

      if (isCorrect) {
        session.hits += 1;
        recordAnswer(target.id, true, x, y);

        recordAnswer(target.id, false, x, y);

            <div class="text-xs font-extrabold ${isCorrect ? 'text-emerald-300' : 'text-rose-300'} mb-1">${isCorrect ? '✓ Correct!' : `✕ Answer: ${target.meaning}`} · <span class="font-mono text-slate-300">${target.romaji}</span></div>

            <button id="btn-mcq-next" class="px-4 py-1.5 rounded-xl text-xs font-black bg-cyan-500 hover:brightness-110 text-slate-950 transition">Next Question → <span class="kbd-chip ml-1 !bg-black/20 !text-slate-950 !border-black/25">Enter</span></button>

          session.idx += 1;
          setupCustomMCQTurn();
        });
      }
    }

            <div class="inline-flex items-center gap-2 mb-3">
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold uppercase border ${pos.badge}">${pos.label}</span>
              <span class="text-xs font-bold text-slate-400">Lesson ${w.lesson}</span>

            <div class="font-jp text-4xl sm:text-5xl font-black text-white">${w.kanji}</div>
            ${w.hasKanji ? `<div class="font-jp text-2xl font-bold text-cyan-300 mt-1.5">${w.kana}</div>` : ''}

            ${!session.flipped ? `

      document.getElementById('btn-back-dash').addEventListener('click', renderDashboard);

      const flipBtn = document.getElementById('btn-fc-flip');
      if (flipBtn) flipBtn.addEventListener('click', () => { session.flipped = true; playSfx('skip'); renderCustomFlashcardUI(); });

      const sentBtn = document.getElementById('btn-fc-sent-audio');
      if (sentBtn) sentBtn.addEventListener('click', () => speakJP(fullJp, true));

      const missBtn = document.getElementById('btn-fc-miss');
      if (missBtn) missBtn.addEventListener('click', (e) => {
        session.misses += 1;
        recordAnswer(w.id, false, e.clientX, e.clientY);
        session.idx += 1; session.flipped = false;
        renderCustomFlashcardUI();
      });

      const knowBtn = document.getElementById('btn-fc-know');
      if (knowBtn) knowBtn.addEventListener('click', (e) => {
        session.hits += 1;
        recordAnswer(w.id, true, e.clientX, e.clientY);
        session.idx += 1; session.flipped = false;
        renderCustomFlashcardUI();
      });
    }

              <div class="text-xl font-black text-cyan-300">${acc}%</div>
            </div>
            <div class="p-3 rounded-2xl bg-white/5 border border-white/10">

      function openCodexFlashcard(wordId) {
        const w = WORD_MAP.get(wordId);
        if (!w) return;
        const pos = POS_STYLES[w.pos] || POS_STYLES.noun;
        const { fullJp, fullEn } = getDetectiveFullSentence(w);
        const isM = state.mastered.includes(w.id);
        speakJP(w.kana, true);

        openModal(`
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold uppercase border ${pos.badge}">${pos.label}</span>
              <span class="text-xs font-bold text-slate-400">Lesson ${w.lesson}: ${w.lessonTitle || ''}</span>
            </div>
            <button data-close-modal class="px-2.5 py-1 rounded-lg bg-white/10 text-xs font-bold text-slate-200">Close</button>
          </div>

          <div class="text-center py-3">
            <div class="text-5xl mb-2">${w.emoji}</div>
            <div class="font-jp text-4xl sm:text-5xl font-black text-white">${w.kanji}</div>
            <div class="font-jp text-xl sm:text-2xl font-bold text-cyan-300 mt-1">${w.kana}</div>
            <div class="text-sm font-mono uppercase tracking-widest text-slate-300 font-bold mt-1">${w.romaji}</div>
            <div class="text-xl sm:text-2xl font-black text-white mt-3">${w.meaning}</div>
            <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs font-semibold text-amber-200">
              <span>⚡</span> ${w.mnemonic}
            </div>
          </div>

          <!-- 1-Line Usage Example + English Explanation -->
          <div class="mt-4 p-4 rounded-2xl bg-slate-900/90 border border-cyan-400/30">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-extrabold uppercase tracking-wider text-cyan-300">💬 Example in One Line</span>
              <button id="fc-modal-sent-speak" class="px-2.5 py-1 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-400/40 text-cyan-200 text-xs font-bold transition">🔊 Hear Sentence</button>
            </div>
            <div class="font-jp text-lg font-bold text-white leading-relaxed">${fullJp}</div>
            <div class="text-sm text-emerald-200 font-semibold mt-1">English: "${fullEn}"</div>
          </div>

          <div class="mt-5 grid grid-cols-2 gap-3">
            <button id="fc-modal-word-speak" class="py-3 rounded-2xl font-bold text-sm bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-400/40 text-cyan-200 transition">🔊 Replay Word</button>
            <button id="fc-modal-toggle-learned" class="py-3 rounded-2xl font-black text-sm ${isM ? 'bg-emerald-500/25 border border-emerald-400/50 text-emerald-200' : 'bg-emerald-500 text-slate-950'} transition">${isM ? '✓ Learned (Click to Undo)' : '✓ Mark as Learned (+25 XP)'}</button>

        document.getElementById('fc-modal-sent-speak').addEventListener('click', () => speakJP(fullJp, true));
        document.getElementById('fc-modal-toggle-learned').addEventListener('click', (e) => {

            state.mastered = state.mastered.filter(x => x !== w.id);

            markMastered(w.id, true);
            addXP(25, e.clientX, e.clientY);
            playSfx('skip');
          }
          openCodexFlashcard(w.id);
          drawList();
        });
      }

      let codexLimit = 120;
      function drawList() {
        const q = searchEl.value.trim().toLowerCase();
        const dayVal = dayEl.value;
        const statusVal = statusEl.value;
        const masteredSet = new Set(state.mastered);

        // Keep live counts updated in dropdown and MCQ buttons
        statusEl.options[1].textContent = `✓ Learned Only (${state.mastered.length})`;
        statusEl.options[3].textContent = `👾 Weak Monsters (${Object.keys(state.weakWords).length})`;
        mcqLearnedBtn.textContent = `📋 MCQ: All Learned (${state.mastered.length})`;
        mcqSubEl.textContent = `${state.mastered.length} learned words ready for a freshly shuffled MCQ quiz`;

        const filtered = WORDS.filter(w => {
          if (dayVal !== 'all' && w.lesson !== Number(dayVal)) return false;
          if (statusVal === 'learned' && !masteredSet.has(w.id)) return false;
          if (statusVal === 'unlearned' && masteredSet.has(w.id)) return false;
          if (statusVal === 'weak' && !state.weakWords[w.id]) return false;
          if (!q) return true;
          return w.kana.includes(q) || w.kanji.includes(q) || w.romaji.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q);
        });
        latestFilteredWords = filtered;
        mcqFilteredBtn.textContent = `🎯 MCQ: Filtered (${filtered.length})`;
        const listEl = document.getElementById('codex-list');
        if (filtered.length === 0) {
          listEl.innerHTML = `<div class="col-span-full glass rounded-2xl p-8 text-center text-sm text-slate-400">No words match this filter yet.</div>`;
          return;
        }
        listEl.innerHTML = filtered.slice(0, codexLimit).map(w => {
          const isM = masteredSet.has(w.id);
          const pos = POS_STYLES[w.pos] || POS_STYLES.noun;
          return `
            <div data-codex-card="${w.id}" class="cursor-pointer glass rounded-2xl p-3.5 border ${isM ? 'border-emerald-400/40 bg-emerald-500/5' : 'border-white/10'} hover:border-cyan-400/60 hover:-translate-y-0.5 transition flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-lg">${w.emoji}</span>
                  <span class="font-jp font-black text-base text-white truncate">${w.kanji}</span>
                  ${w.hasKanji ? `<span class="font-jp text-xs text-cyan-300">${w.kana}</span>` : ''}
                </div>
                <div class="text-xs font-semibold text-slate-200 mb-1">${w.meaning}</div>
                <div class="flex items-center gap-1.5 text-[10px]">
                  <span class="px-1.5 py-0.5 rounded border ${pos.badge}">${pos.label}</span>
                  <span class="text-slate-400">Lesson ${w.lesson} · Tap for card</span>
                </div>
              </div>
              <div class="flex flex-col gap-1.5 shrink-0">
                <button data-codex-speak="${w.id}" class="p-1.5 rounded-lg bg-cyan-500/15 hover:bg-cyan-500/30 text-cyan-300 text-xs">🔊</button>
                <button data-codex-toggle="${w.id}" class="px-2 py-1 rounded-lg text-[10px] font-bold ${isM ? 'bg-emerald-500/25 text-emerald-200 border border-emerald-400/40' : 'bg-white/5 text-slate-300 border border-white/10'}">${isM ? '✓ Learned' : 'Mark Learned'}</button>
              </div>
            </div>
          `;
        }).join('') + (filtered.length > codexLimit ? `<div class="col-span-full text-center py-4"><button id="btn-codex-more" class="px-4 py-2 rounded-xl text-xs font-bold bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-400/40 text-cyan-200 transition">Show All ${filtered.length} Words</button></div>` : '');

        const moreBtn = document.getElementById('btn-codex-more');
        if (moreBtn) moreBtn.addEventListener('click', () => { codexLimit = WORDS.length; drawList(); });
        listEl.querySelectorAll('[data-codex-card]').forEach(card => {
          card.addEventListener('click', () => openCodexFlashcard(Number(card.dataset.codexCard)));
        });
        listEl.querySelectorAll('[data-codex-speak]').forEach(b => {
          b.addEventListener('click', (e) => { e.stopPropagation(); speakJP(WORD_MAP.get(Number(b.dataset.codexSpeak)).kana, true); });
        });
        listEl.querySelectorAll('[data-codex-toggle]').forEach(b => {
          b.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = Number(b.dataset.codexToggle);
            if (state.mastered.includes(id)) {
              state.mastered = state.mastered.filter(x => x !== id);
              saveState(); updateHUD();
            } else {
              markMastered(id, true);
              addXP(25, e.clientX, e.clientY);
              playSfx('skip');
            }
            drawList();
          });
        });
      }

      searchEl.addEventListener('input', drawList);
      dayEl.addEventListener('change', drawList);
      statusEl.addEventListener('change', drawList);
      drawList();
    }

    function openModal(html) {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      box.innerHTML = html;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      const closeBtn = box.querySelector('[data-close-modal]');
      if (closeBtn) closeBtn.addEventListener('click', closeModal);
    }
    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') closeModal();
    });

      openModal(`

    function downloadVocabJSON() {
      const blob = new Blob([JSON.stringify(DATASET, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'minna-n5-25-lessons-vocab.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('📥 Downloaded full 25-Lesson JSON!', 'cyan');
    }

    // Global Keyboard Shortcuts (1-4, Space, Enter, K)
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') {
        if (view === 'forge' && session && session.words[session.idx]) {
          e.preventDefault(); speakJP(session.words[session.idx].kana, true);
        } else if (view === 'sushi' && session && session.queue[session.idx]) {
          e.preventDefault(); speakJP(session.queue[session.idx].kana, true);
        } else if (view === 'detective' && session && session.queue[session.idx]) {
          e.preventDefault();
          const cur = session.queue[session.idx];
          speakJP(session.locked ? getDetectiveFullSentence(cur).fullJp : cur.kana, true);
        
        } else if (view === 'boss' && session && session.queue[session.idx]) {
          e.preventDefault(); speakJP(session.queue[session.idx].kana, true);
        } else if ((view === 'custom_mcq' || view === 'custom_cards') && session && session.queue[session.idx]) {
          e.preventDefault(); speakJP(session.queue[session.idx].kana, true);
        } else if (view === 'kanji_forge' && session && session.pool[session.idx]) {
          e.preventDefault(); speakJP(getKanjiPrimaryReading(session.pool[session.idx]), true);
        } else if ((view === 'kanji_mcq' || view === 'kanji_cards') && session && session.queue[session.idx]) {
          e.preventDefault(); speakJP(getKanjiPrimaryReading(session.queue[session.idx]), true);
        }
      } else if (e.code === 'Enter') {
        if (view === 'forge') {
          const btn = document.getElementById('btn-forge-next');
          if (btn) { e.preventDefault(); btn.click(); }
        } else if (view === 'detective') {
          const nextBtn = document.getElementById('btn-det-next');
          if (nextBtn) { e.preventDefault(); nextBtn.click(); }
        } else if (view === 'custom_mcq') {
          const nextBtn = document.getElementById('btn-mcq-next');
          if (nextBtn) { e.preventDefault(); nextBtn.click(); }
        } else if (view === 'custom_cards') {
          const flipBtn = document.getElementById('btn-fc-flip');
          if (flipBtn) { e.preventDefault(); flipBtn.click(); }
        } else if (view === 'kanji_forge') {
          const btn = document.getElementById('kf-master');
          if (btn) { e.preventDefault(); btn.click(); }
        } else if (view === 'kanji_mcq') {
          const btn = document.getElementById('kmcq-next');
          if (btn) { e.preventDefault(); btn.click(); }
        } else if (view === 'kanji_cards') {
          const card = document.getElementById('kfc-card');
          if (card && !session.flipped) { e.preventDefault(); card.click(); }
        }
      } else if (e.key.toLowerCase() === 'k') {
        if (view === 'forge') {
          const btn = document.getElementById('btn-already-know');
          if (btn) { e.preventDefault(); btn.click(); }
        }
      } else if (['1', '2', '3', '4'].includes(e.key)) {
        const idx = Number(e.key) - 1;
        if (view === 'sushi') handleSushiChoice(idx);
        else if (view === 'detective') handleDetectiveChoice(idx);
        else if (view === 'boss') handleBossChoice(idx);
        else if (view === 'custom_mcq') handleCustomMCQChoice(idx);
        else if (view === 'kanji_mcq') handleKanjiMCQChoice(idx);
      }
    });

    function setSectionTab(section) {

        kTab.className = 'px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black transition bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300';
      }

    function getKanjiDayList(dayNum) {
      return KANJI_LIST.filter(k => k.day === dayNum);
    }

    function getKanjiDayParts(dayNum) {
      const list = getKanjiDayList(dayNum);
      return [1, 2, 3].map(p => list.filter(k => k.part === p));
    }

    function getKanjiDayMastered(dayNum) {
      const mSet = new Set(state.kanjiMastered || []);
      return getKanjiDayList(dayNum).filter(k => mSet.has(k.id)).length;
    }

    function markKanjiMastered(kanjiId) {
      if (!Array.isArray(state.kanjiMastered)) state.kanjiMastered = [];
      if (!state.kanjiMastered.includes(kanjiId)) state.kanjiMastered.push(kanjiId);
      if (state.kanjiWeak && state.kanjiWeak[kanjiId]) {
        state.kanjiWeak[kanjiId].streak = (state.kanjiWeak[kanjiId].streak || 0) + 1;
        if (state.kanjiWeak[kanjiId].streak >= 2) delete state.kanjiWeak[kanjiId];
      }
      saveState();
      updateHUD();
    }

    function markKanjiWeak(kanjiId) {
      if (!state.kanjiWeak) state.kanjiWeak = {};
      if (!state.kanjiWeak[kanjiId]) state.kanjiWeak[kanjiId] = { streak: 0, misses: 0 };
      state.kanjiWeak[kanjiId].streak = 0;
      state.kanjiWeak[kanjiId].misses += 1;
      saveState();
      updateHUD();
    }

    function cleanKanjiReading(str) {
      return String(str || '').replace(/[()]/g, '').trim();
    }

    function getKanjiPrimaryReading(k) {
      const parts = [];
      if (k.kun && k.kun !== '—') parts.push(cleanKanjiReading(k.kun));
      if (k.on && k.on !== '—') parts.push(cleanKanjiReading(k.on));
      if (parts.length) return parts.join('、');
      return k.words && k.words[0] ? k.words[0].r : k.kanji;
    }

    function getKanjiFullReadingLabel(k) {
      const parts = [];
      if (k.kun && k.kun !== '—') parts.push(k.kun);
      if (k.on && k.on !== '—') parts.push(k.on);
      return parts.join(' / ');
    }

    function pickKanjiDistractors(target, pool, count = 3) {
      const candidates = (pool.length >= count + 1 ? pool : KANJI_LIST).filter(k => k.id !== target.id && k.meaning !== target.meaning);
      return shuffle(candidates).slice(0, count);
    }

      view = 'kanji_forge';
      setSectionTab('kanji');
      session = {
        pool: kanjiPool.slice(),
        idx: 0,
        label: label || 'Kanji Forge',
        peekMode: false,
        revealed: false
      };
      renderKanjiForgeCard();
    }

    function renderKanjiForgeCard() {
      const k = session.pool[session.idx];
      if (!k) { renderKanjiDashboard(); return; }
      const isM = (state.kanjiMastered || []).includes(k.id);
      const hidden = session.peekMode && !session.revealed;
      speakJP(getKanjiPrimaryReading(k));

      const root = document.getElementById('app-root');
      root.innerHTML = `

              <div class="mt-5 text-left space-y-2">
                <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">Prerequisite Vocabulary & Examples</div>

                  <div class="p-3 rounded-2xl bg-slate-900/85 border border-white/10 flex items-start justify-between gap-3">
                    <div>
                      <div class="flex flex-wrap items-baseline gap-2">
                        <span class="font-jp text-lg font-black text-white">${w.w}</span>
                        <span class="font-jp text-sm font-bold text-cyan-300">${w.r}</span>
                        <span class="text-xs font-semibold text-emerald-300">— ${w.m}</span>
                      </div>
                      <div class="font-jp text-xs text-slate-300 mt-1">${w.ex}</div>
                    </div>
                    <button data-kf-word-speak="${wi}" class="shrink-0 px-2.5 py-1.5 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-400/35 text-cyan-200 text-xs font-bold">🔊</button>

            <button id="kf-prev" class="px-4 py-3 rounded-2xl font-bold text-sm bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 ${session.idx === 0 ? 'opacity-40 pointer-events-none' : ''}">← Prev</button>
            <div class="flex flex-wrap items-center gap-2">
              <button id="kf-master" class="px-5 py-3 rounded-2xl font-black text-sm bg-gradient-to-r from-emerald-500 to-teal-600 hover:brightness-110 text-white shadow-lg transition">

      document.getElementById('kf-back').addEventListener('click', renderKanjiDashboard);
      document.getElementById('kf-speak').addEventListener('click', () => speakJP(getKanjiPrimaryReading(k), true));
      document.getElementById('kf-kanji-tap').addEventListener('click', () => speakJP(getKanjiPrimaryReading(k), true));
      const kunBtn = document.getElementById('kf-speak-kun');
      if (kunBtn) kunBtn.addEventListener('click', () => speakJP(k.kun !== '—' ? cleanKanjiReading(k.kun) : getKanjiPrimaryReading(k), true));
      const onBtn = document.getElementById('kf-speak-on');
      if (onBtn) onBtn.addEventListener('click', () => speakJP(k.on !== '—' ? cleanKanjiReading(k.on) : getKanjiPrimaryReading(k), true));
      document.getElementById('kf-peek').addEventListener('click', () => {
        session.peekMode = !session.peekMode;
        session.revealed = false;
        renderKanjiForgeCard();
      });
      const revBtn = document.getElementById('kf-reveal');
      if (revBtn) revBtn.addEventListener('click', () => { session.revealed = true; renderKanjiForgeCard(); });

      root.querySelectorAll('[data-kf-word-speak]').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = k.words[Number(btn.dataset.kfWordSpeak)];
          if (item) speakJP(item.ex || item.r, true);
        });
      });

      document.getElementById('kf-prev').addEventListener('click', () => {
        if (session.idx > 0) { session.idx--; session.revealed = false; renderKanjiForgeCard(); }
      });

      document.getElementById('kf-master').addEventListener('click', (e) => {
        if (!(state.kanjiMastered || []).includes(k.id)) {
          markKanjiMastered(k.id);
          addXP(25, e.clientX, e.clientY);
          playSfx('hit');
        }
        if (session.idx + 1 < session.pool.length) {
          session.idx++;
          session.revealed = false;
          renderKanjiForgeCard();
        } else {
          showToast(`🎉 Finished ${session.label}! Ready for MCQ Quiz!`, 'emerald');
          renderKanjiDashboard();
        }
      });

    // --- KANJI CUSTOM DAY TEST MODAL ---
    function openKanjiCustomTestModal(dayNum) {
      const parts = getKanjiDayParts(dayNum);
      const mSet = new Set(state.kanjiMastered || []);
      openModal(`
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-xl font-black text-white">📝 Kanji Day ${dayNum} Custom Test</h3>
            <p class="text-xs text-slate-400">Select which parts (10 kanji each) to test in a freshly shuffled order.</p>
          </div>
          <button data-close-modal class="px-2.5 py-1 rounded-lg bg-white/10 text-xs font-bold text-slate-200">Close</button>
        </div>

        <div class="space-y-2.5 mb-5">
          ${parts.map((pList, idx) => {
            const done = pList.filter(k => mSet.has(k.id)).length;
            return `
              <label class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-900/80 border border-white/10 cursor-pointer hover:border-amber-400/50 transition">
                <div class="flex items-center gap-3">
                  <input type="checkbox" data-kct-part="${idx}" checked class="w-4 h-4 accent-amber-400" />
                  <div>
                    <div class="font-extrabold text-sm text-white">Part ${idx + 1} (Kanji #${pList[0].id}–#${pList[pList.length - 1].id})</div>
                    <div class="font-jp text-xs text-slate-400 tracking-widest mt-0.5">${pList.map(k => k.kanji).join(' ')}</div>
                  </div>
                </div>
                <span class="text-xs font-bold ${done === pList.length ? 'text-emerald-300' : 'text-amber-300'}">${done}/${pList.length}</span>
              </label>
            `;
          }).join('')}
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button id="kct-mcq" class="py-3.5 px-4 rounded-2xl font-black text-sm bg-gradient-to-r from-cyan-500 to-blue-600 hover:brightness-110 text-white shadow-lg transition">📋 Start Shuffled Kanji MCQ</button>
          <button id="kct-cards" class="py-3.5 px-4 rounded-2xl font-black text-sm bg-gradient-to-r from-purple-500 to-pink-600 hover:brightness-110 text-white shadow-lg transition">🃏 Start Shuffled Flashcards</button>
        </div>
      `);

      const box = document.getElementById('modal-box');
      function getPickedKanji() {
        const list = [];
        box.querySelectorAll('[data-kct-part]:checked').forEach(cb => list.push(...parts[Number(cb.dataset.kctPart)]));
        return list;
      }
      document.getElementById('kct-mcq').addEventListener('click', () => {
        const picked = getPickedKanji();
        if (picked.length < 2) { showToast('Select at least 1 part!', 'rose'); return; }
        closeModal();
        startKanjiMCQ(picked, { returnTo: 'kanji_dashboard', label: `KANJI DAY ${dayNum} MCQ` });
      });
      document.getElementById('kct-cards').addEventListener('click', () => {
        const picked = getPickedKanji();
        if (picked.length < 1) { showToast('Select at least 1 part!', 'rose'); return; }
        closeModal();
        startKanjiFlashcards(picked, 'kanji_dashboard');
      });
    }

    // --- SHUFFLED KANJI MCQ (MEANING + READING MIX) ---
    function startKanjiMCQ(kanjiPool, opts = {}) {
      clearAllTimers();
      view = 'kanji_mcq';
      setSectionTab('kanji');
      const shuffledAll = shuffle(kanjiPool);
      const limit = opts.limit && opts.limit > 0 ? Math.min(opts.limit, shuffledAll.length) : shuffledAll.length;
      session = {
        pool: kanjiPool.slice(),
        queue: shuffledAll.slice(0, limit),
        idx: 0,
        hits: 0,
        misses: 0,
        locked: false,
        qType: 'meaning',
        options: [],
        returnTo: opts.returnTo || 'kanji_dashboard',
        label: opts.label || 'KANJI MCQ',
        limit: opts.limit || 0
      };
      setupKanjiMCQTurn();
    }

    function setupKanjiMCQTurn() {
      if (session.idx >= session.queue.length) {
        renderKanjiTestSummary();
        return;
      }
      const target = session.queue[session.idx];
      session.qType = (session.idx % 2 === 0) ? 'meaning' : 'reading';
      session.options = shuffle([target, ...pickKanjiDistractors(target, session.pool.length >= 4 ? session.pool : KANJI_LIST, 3)]);
      session.locked = false;
      renderKanjiMCQUI();
    }

    function renderKanjiMCQUI() {
      const target = session.queue[session.idx];
      const isReading = session.qType === 'reading';
      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="max-w-2xl mx-auto">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <button id="kmcq-back" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300">${session.returnTo === 'kanji_codex' ? '← 120-Kanji Codex' : '← Kanji Dashboard'}</button>
            <span class="px-3 py-1 rounded-full text-xs font-extrabold bg-amber-500/20 text-amber-200 border border-amber-400/40">📋 ${session.label} · ${session.idx + 1} / ${session.queue.length}</span>
            <button id="kmcq-speak" class="px-2.5 py-1 rounded-xl text-xs font-bold bg-cyan-500/20 text-cyan-200 border border-cyan-400/40">🔊 Hint</button>
          </div>

          <div class="glass rounded-3xl p-6 sm:p-8 border border-amber-400/35 text-center mb-5 animate-pop">
            <div class="text-xs font-extrabold uppercase tracking-wider ${isReading ? 'text-cyan-300' : 'text-amber-300'} mb-2">
              ${isReading ? 'Choose the Reading (Hiragana / Katakana)' : 'Choose the English Meaning'}
            </div>
            <div class="font-jp text-7xl sm:text-8xl font-black text-white my-2">${target.kanji}</div>
            <div class="text-xs text-slate-400">Kanji #${target.id} · Day ${target.day}</div>
            <div id="kmcq-feedback" class="mt-4"></div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${session.options.map((opt, i) => `
              <button data-kmcq-opt="${i}" class="glass rounded-2xl p-4 text-left border border-white/15 hover:border-amber-400/70 hover:bg-amber-500/10 transition flex items-center gap-3">
                <span class="kbd-chip">${i + 1}</span>
                <span class="${isReading ? 'font-jp' : ''} font-bold text-sm sm:text-base text-white">${isReading ? getKanjiFullReadingLabel(opt) : opt.meaning}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;

      document.getElementById('kmcq-back').addEventListener('click', () => session.returnTo === 'kanji_codex' ? renderKanjiCodex() : renderKanjiDashboard());
      document.getElementById('kmcq-speak').addEventListener('click', () => speakJP(getKanjiPrimaryReading(target), true));
      root.querySelectorAll('[data-kmcq-opt]').forEach(btn => {
        btn.addEventListener('click', (e) => handleKanjiMCQChoice(Number(btn.dataset.kmcqOpt), e.clientX, e.clientY));
      });
    }

    function handleKanjiMCQChoice(choiceIdx, x, y) {
      if (session.locked) return;
      session.locked = true;
      const target = session.queue[session.idx];
      const chosen = session.options[choiceIdx];
      const correct = chosen.id === target.id;
      const root = document.getElementById('app-root');

      root.querySelectorAll('[data-kmcq-opt]').forEach((btn, idx) => {
        const opt = session.options[idx];
        btn.disabled = true;
        if (opt.id === target.id) btn.classList.add('border-emerald-400', 'bg-emerald-500/20');
        else if (idx === choiceIdx && !correct) btn.classList.add('border-rose-400', 'bg-rose-500/20');
        else btn.classList.add('opacity-45');
      });

      speakJP(getKanjiPrimaryReading(target), true);

      if (correct) {
        session.hits++;
        state.streak++;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;
        markKanjiMastered(target.id);
        addXP(30, x, y);
        playSfx('hit');
      } else {
        session.misses++;
        state.streak = 0;
        markKanjiWeak(target.id);
        playSfx('miss');
      }

      const exWord = target.words && target.words[0];
      const fb = document.getElementById('kmcq-feedback');
      fb.innerHTML = `
        <div class="p-3.5 rounded-2xl ${correct ? 'bg-emerald-500/15 border border-emerald-400/40' : 'bg-rose-500/15 border border-rose-400/40'} text-left">
          <div class="font-black text-sm ${correct ? 'text-emerald-300' : 'text-rose-300'}">${correct ? '✓ Correct!' : '✗ Not quite'} — ${target.kanji} (${getKanjiFullReadingLabel(target)}) = ${target.meaning}</div>
          <div class="text-xs text-amber-200 mt-1">💡 ${target.tip}</div>
          ${exWord ? `<div class="font-jp text-xs text-slate-200 mt-1">Example: <strong>${exWord.w}</strong> (${exWord.r}) — ${exWord.m}</div>` : ''}
        </div>
        <button id="kmcq-next" class="mt-3 px-6 py-2.5 rounded-2xl font-black text-sm bg-gradient-to-r from-amber-500 to-rose-600 hover:brightness-110 text-white shadow-lg transition">
          ${session.idx + 1 < session.queue.length ? 'Next Kanji →' : 'See Results →'}
        </button>
      `;
      document.getElementById('kmcq-next').addEventListener('click', () => {
        session.idx++;
        setupKanjiMCQTurn();
      });
    }

    function renderKanjiTestSummary() {
      playSfx('victory');
      const total = Math.max(1, session.hits + session.misses);
      const acc = Math.round((session.hits / total) * 100);
      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="max-w-xl mx-auto glass rounded-3xl p-7 text-center border border-amber-400/40 animate-pop">
          <div class="text-5xl mb-3">漢</div>
          <h2 class="text-2xl font-black text-white mb-1">${session.label} Complete!</h2>
          <p class="text-sm text-slate-300 mb-5">Tested ${session.queue.length} Kanji in random order.</p>
          <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="p-3 rounded-2xl bg-white/5 border border-white/10"><div class="text-xs text-slate-400">Correct</div><div class="text-xl font-black text-emerald-300">${session.hits}</div></div>
            <div class="p-3 rounded-2xl bg-white/5 border border-white/10"><div class="text-xs text-slate-400">Accuracy</div><div class="text-xl font-black text-amber-300">${acc}%</div></div>
            <div class="p-3 rounded-2xl bg-white/5 border border-white/10"><div class="text-xs text-slate-400">Weak Flagged</div><div class="text-xl font-black text-rose-300">${session.misses}</div></div>
          </div>
          <div class="flex flex-wrap justify-center gap-3">
            <button id="kts-retake" class="px-5 py-3 rounded-2xl font-black text-sm bg-gradient-to-r from-amber-500 to-rose-600 hover:brightness-110 text-white transition">🔀 Retake (New Shuffle)</button>
            <button id="kts-back" class="px-5 py-3 rounded-2xl font-bold text-sm bg-white/10 hover:bg-white/15 text-white transition">${session.returnTo === 'kanji_codex' ? '← Back to Codex' : '← Kanji Dashboard'}</button>
          </div>
        </div>
      `;
      document.getElementById('kts-retake').addEventListener('click', () => startKanjiMCQ(session.pool, { returnTo: session.returnTo, label: session.label, limit: session.limit }));
      document.getElementById('kts-back').addEventListener('click', () => session.returnTo === 'kanji_codex' ? renderKanjiCodex() : renderKanjiDashboard());
    }

    // --- SHUFFLED KANJI FLASHCARDS ---
    function startKanjiFlashcards(kanjiPool, returnTo = 'kanji_dashboard') {
      clearAllTimers();
      view = 'kanji_cards';
      setSectionTab('kanji');
      session = {
        pool: kanjiPool.slice(),
        queue: shuffle(kanjiPool),
        idx: 0,
        hits: 0,
        misses: 0,
        flipped: false,
        returnTo
      };
      renderKanjiFlashcardUI();
    }

    function renderKanjiFlashcardUI() {
      if (session.idx >= session.queue.length) {
        session.label = 'Kanji Flashcards';
        renderKanjiTestSummary();
        return;
      }
      const k = session.queue[session.idx];
      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="max-w-xl mx-auto">
          <div class="flex items-center justify-between gap-2 mb-4">
            <button id="kfc-back" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300">← Kanji Dashboard</button>
            <span class="px-3 py-1 rounded-full text-xs font-extrabold bg-purple-500/20 text-purple-200 border border-purple-400/40">🃏 KANJI CARDS · ${session.idx + 1} / ${session.queue.length}</span>
            <button id="kfc-speak" class="px-2.5 py-1 rounded-xl text-xs font-bold bg-cyan-500/20 text-cyan-200 border border-cyan-400/40">🔊</button>
          </div>

          <div id="kfc-card" class="glass rounded-3xl p-7 border border-purple-400/35 text-center cursor-pointer animate-pop">
            <div class="text-xs text-slate-400 mb-2">Kanji #${k.id} · Day ${k.day}</div>
            <div class="font-jp text-7xl sm:text-8xl font-black text-white my-3">${k.kanji}</div>
            ${!session.flipped ? `
              <div class="mt-4 text-xs font-bold text-purple-200 bg-purple-500/20 border border-purple-400/40 inline-block px-4 py-2 rounded-xl">👆 Tap card to flip</div>
            ` : `
              <div class="mt-3 font-jp text-xl font-black text-cyan-300">Kun: ${k.kun} · On: ${k.on}</div>
              <div class="text-2xl font-black text-white mt-2">${k.meaning}</div>
              <div class="text-xs text-amber-200 mt-1.5">💡 ${k.tip}</div>
              <div class="mt-4 text-left space-y-1.5">
                ${k.words.slice(0, 2).map(w => `<div class="p-2.5 rounded-xl bg-slate-900/80 border border-white/10 text-xs"><strong class="font-jp text-white text-sm">${w.w}</strong> <span class="font-jp text-cyan-300">(${w.r})</span> — <span class="text-emerald-300">${w.m}</span></div>`).join('')}
              </div>
            `}
          </div>

          ${session.flipped ? `
            <div class="mt-4 grid grid-cols-2 gap-3">
              <button id="kfc-miss" class="py-3 rounded-2xl font-black text-sm bg-rose-500/20 hover:bg-rose-500/30 border border-rose-400/40 text-rose-200 transition">Need Review</button>
              <button id="kfc-hit" class="py-3 rounded-2xl font-black text-sm bg-gradient-to-r from-emerald-500 to-teal-600 hover:brightness-110 text-white shadow-lg transition">✓ Got It (+25 XP)</button>
            </div>
          ` : ''}
        </div>
      `;

      document.getElementById('kfc-back').addEventListener('click', renderKanjiDashboard);
      document.getElementById('kfc-speak').addEventListener('click', () => speakJP(getKanjiPrimaryReading(k), true));
      document.getElementById('kfc-card').addEventListener('click', () => {
        if (!session.flipped) {
          session.flipped = true;
          speakJP(getKanjiPrimaryReading(k), true);
          renderKanjiFlashcardUI();
        }
      });
      const hitBtn = document.getElementById('kfc-hit');
      const missBtn = document.getElementById('kfc-miss');
      if (hitBtn) hitBtn.addEventListener('click', (e) => {
        session.hits++; markKanjiMastered(k.id); addXP(25, e.clientX, e.clientY); playSfx('hit');
        session.idx++; session.flipped = false; renderKanjiFlashcardUI();
      });
      if (missBtn) missBtn.addEventListener('click', () => {
        session.misses++; markKanjiWeak(k.id); playSfx('miss');
        session.idx++; session.flipped = false; renderKanjiFlashcardUI();
      });
    }

          <button data-close-modal class="px-2.5 py-1 rounded-lg bg-white/10 text-xs font-bold text-slate-200">Close</button>
        </div>

          <div class="text-2xl font-black text-white mt-2">${k.meaning}</div>
